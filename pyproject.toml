[tool.poetry]
name = "sros-enable-netconf"
version = "0.1.0"
description = "Programmatically enable NETCONF on Nokia SROS."
authors = ["h4ndzdatm0ld <hugotinoco@icloud.com>"]
readme = "README.md"
repository = "https://github.com/h4ndzdatm0ld/sros-enable-netconf"
keywords = ["sros", "ncclient", "netconf", "network automation", "nokia", "7750"]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
xmltodict = ">=1.0,<2"
netmiko = ">=4.8,<5"
ncclient = ">=0.7.1,<0.8"
paramiko = ">=3.4,<6"
cryptography = ">=46.0.5,<51"
lxml = ">=6.1,<7"

[tool.poetry.group.dev.dependencies]
flake8 = ">=7,<8"
pylint = ">=3,<5"
pydocstyle = "^6.1.1"
bandit = "^1.7.0"
yamllint = "^1.26.3"
black = ">=26,<27"
pytest = ">=9,<10"
ipython = ">=9,<10"
pytest-cov = ">=7,<8"
coverage = ">=7,<8"
isort = ">=6,<8"

[build-system]
requires = ["poetry-core>=2.2,<3"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = [
    "tests"
]

[tool.pylint.messages_control]
# Line length is enforced by Black, so pylint doesn't need to check it.
# Pylint and Black disagree about how to format multi-line arrays; Black wins.
disable = """,
    line-too-long,
    bad-continuation,
    """

[tool.pylint.miscellaneous]
# Don't flag TODO as a failure, let us commit with things that still need to be done in the code
notes = """,
    FIXME,
    XXX,
    """

[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
        /(
          \.git
        | \.tox
        | \.venv
        | env/
        | _build
        | build
        | dist
        )/
    '''
