name: Python application

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.4'
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Install locked dependencies without the system pip bootstrap
        run: |
          uv tool install poetry==2.5.1 --with poetry-plugin-export==1.10.1
          poetry env use "$(uv python find)"
          poetry check --lock
          poetry sync --no-interaction
      - name: Audit the complete locked runtime dependency inventory
        run: |
          poetry export -f requirements.txt --output /tmp/runtime-requirements.txt
          uv tool run --from pip-audit==2.10.1 pip-audit --require-hashes --no-deps --disable-pip -r /tmp/runtime-requirements.txt
      - name: Run offline tests
        run: poetry run pytest --cov=sros_enable_netconf --cov-report=xml -vv
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
